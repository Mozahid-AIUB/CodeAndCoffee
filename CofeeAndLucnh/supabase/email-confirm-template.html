<div style="font-family:Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#2b1d12">
  <h2 style="margin:0 0 12px">Confirm your email</h2>
  <p>Welcome to Manus Office. Tap the button below to verify your company email and activate your account.</p>
  <p style="margin:24px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
     style="background:#b5651d;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600">Verify email</a></p>
  <p style="font-size:13px;color:#7a6756">If you did not create this account, you can ignore this email.</p>
</div>
